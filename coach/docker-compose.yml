services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach_dev_only
      POSTGRES_DB: coach
    volumes:
      - coach_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed/seed_levels.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      # Host port 5433, not 5432 -- avoids colliding with a dev's own local Postgres.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://coach:coach_dev_only@postgres:5432/coach
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COACH_API_TOKEN: ${COACH_API_TOKEN:-}
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:8000"

  ui:
    build: ./ui
    environment:
      VITE_API_BASE_URL: http://localhost:8787
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  coach_pgdata:
